<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fonts - size</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
      .permanent-marker-regular {
      font-family: "Permanent Marker", cursive;
      font-weight: 400;
      font-style: normal; 
    }

      .light {
        font-weight: 300;
      }

      .normal {
        font-weight: 400;
      }

      .bold {
        font-weight: 700;
      }

      .italic {
        font-style: italic;
      }

      .letter-spacing {
        letter-spacing: 10px;
      }

      .upper {
        text-transform: uppercase;
      } 

      .lower {
        text-transform: lowercase;
        text-decoration: underline;
      }

      .capi {
        text-transform: capitalize;
        text-decoration: line-through;
      }

      .underline {
        text-decoration: underline;
      }

      .line-through {
        text-decoration: line-through;
      }

      .no-decoration {
        text-decoration: none;
      }
 </style>
</head>
<body>  
  <p class="light letter-spacing">Light text</p> 
  <p class="normal">Normal Text</p> 
  <p class="bold italic">Bold text</p> 
  <p class="upper">Uppercase</p>
  <p class="lower">Lowercase</p>
  <p class="capi">Capitalize</p>
  <a href="#" class="no-decoration">Hola mundo</a>
  <p class="permanent-marker-regular">Hola mundo como estas</p>
</body>
</html>
