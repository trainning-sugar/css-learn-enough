<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout and positioning</title>
  <style>
    .block {
      background-color: lightblue;
      padding: 10px;
    }
    .inline {
      background-color: lightgreen;
      padding: 5px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
    <div  class="block hidden">I'm a block element</div>
    <span class="inline">I'm inline element</span>
    <span class="inline">I'm inline element</span>
</body>
</html>
