<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box model</title>
  <!-- 
      Every HTML element is a rectangular box with four layers
      inside - outside
      - Content - Padding - Border(edge around de element) - Margin(space on the outside of the border)
      - Determines how elements take out space on a web page
      - Every HTML element is a rectangular box with four layers
    -->
  <style>
    .box {
      width: 250px;
      height: 150px;
      background-color: lightgreen  ;
    }

    .box1 {
      padding: 20px 20px 15px 15px; /* top-right-bottom - left*/
    }

    .box3 {
    /*  border: 5px solid black; boder-with, border-style and borther-color. Shorthand
      border: 3px dashed red;
      border: 4px dotted blue;
      border: 4px double green;
      border: 4px groove pink;  
      border: 4px groove pink; */
      border: 4px inset pink;
    }
    /*Esto sale en circulo */
    .box4 {
      border: 1px solid black;
      width: 100px;
      height: 100px;
      border-radius: 50px;
    }

    /*Margin */
    .box5 {
      width: 200px;
      background-color: lightblue;
      margin: auto;
      text-align: center;
    }

   /*  
     
     Cuanto mide la cajita - sin box-sizing:border-box
     Width total de la caja : 200px + 20px(padding right) + 20px(padding left) + 5px(border right) + 5px(border left) = 250px
     Height total de la caja : 200px + 20px + 20px + 5px + 5px = 250px (padding + border) Top y bottom
     El margen no forma parte del tamaño del elemento. Solo añade espacio alrededor.
     
     Con box-sizing:border-box
    width: 200px
    height: 200px 
    En el calculo esta incluido el padding y el border
     */
   

   .box6 {
      width: 200px;
      height: 200px;
      padding: 20px;
      border: 5px solid black;
      margin: 30px;
      box-sizing: border-box;
   }


   .box7 {
    box-shadow: 
        3px 3px red,
      -1em 0 0.4em olive;
   }

  </style>
  
</head>
<body>
  <div class="box7">Hello, I'm a box!</div>
</body>
</html>
