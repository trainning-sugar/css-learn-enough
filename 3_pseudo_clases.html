<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo Clases</title>

  <style>
      /* Pseudo classes */
    button:hover {
      color: white;
      background-color: brown;
    }

    button:disabled {
      color:blue
    }

    input:focus {
      border: 3px solid yellow
    }

   /* 
    Odd son los pares 0, 2, 4 
    even son los impares 1, 3, 5
    entre parentesis las variables
   */   

    li:nth-child(even) {
      background-color: limegreen;
    }


    li:nth-child(3) {
      background-color: rebeccapurple;
    }




  </style>

</head>
<body> 
  <button>Hover me</button>
  <input type="text" placeholder="click here" />
  
  <ul>
    <li>Item 0</li>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
    <li>Item 4</li>
    <li>Item 5</li>
    <li>Item 6</li>
    <li>Item 7</li>
  </ul>

</body>
</html>
